services:
  pgadmin:
    container_name: boost-hub-pgadmin
    image: dpage/pgadmin4:7.7
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    env_file:
      - .env
    networks:
      - boost-hub

networks:
  boost-hub:
    name: boost-hub
    driver: bridge