services:
  postgres_db:
    container_name: boost-hub-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - boost_hub_postgres_db_data:/var/lib/postgresql/data
    env_file:
      - .env

  backend:
    container_name: boost-hub-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8001:8081"
    depends_on:
      - postgres_db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
    env_file:
      - .env

volumes:
  boost_hub_postgres_db_data:

networks:
  default:
    name: boost-hub
    driver: bridge